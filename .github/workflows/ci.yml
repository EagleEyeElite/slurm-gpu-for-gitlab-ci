# Self-checks that need no cluster: the scripts parse and pass shellcheck,
# the unit tests (fake salloc/scontrol, the monitor's record), and the nix
# flake -- module evaluation and the two home configurations build.
name: ci
on:
  push:
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: for f in slurm/bin/* slurm/lib/*.sh slurm/*.sh builders/*/*.sh bootstrap/*.sh; do bash -n "$f" || exit 1; done
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning -x slurm/bin/* slurm/lib/*.sh slurm/*.sh builders/kaniko/*.sh builders/buildah/*.sh bootstrap/*.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pytest
        run: |
          pip install --quiet pytest matplotlib pyyaml
          python -m pytest -q slurm/tests slurm/monitor/tests

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: nix flake check
        run: nix flake check -L
